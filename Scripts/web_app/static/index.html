<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchwise — Football Predictions</title>
  <meta name="description" content="AI-powered football betting predictions with real-time odds analysis across Europe's top leagues.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ===== Top Navigation Bar ===== -->
  <header class="topbar" role="banner">
    <div class="topbar-inner">
      <div class="logo" onclick="navigateTo('home')" tabindex="0" role="link" aria-label="Matchwise home">
        <span class="logo-mark">M</span>
        <span class="logo-text">Matchwise</span>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <button class="nav-link active" data-view="home">Fixtures</button>
        <button class="nav-link" data-view="best-bets">Best Bets</button>
      </nav>
      <div class="topbar-right">
        <button class="slip-indicator hidden" id="slipIndicator" onclick="toggleMobileSlip()" aria-label="Open bet slip">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M6 6h6M6 9h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span class="slip-indicator-count" id="slipIndicatorCount">0</span>
          <span class="slip-indicator-odds" id="slipIndicatorOdds"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== Main Layout ===== -->
  <div class="layout" id="layout">

    <!-- Main Content Area -->
    <main class="main" id="mainContent">

      <!-- Home View -->
      <section class="view" id="viewHome">
        <div class="page-header">
          <h1 class="page-title">Today's Matches</h1>
          <p class="page-subtitle">AI-powered predictions across Europe's top leagues</p>
        </div>
        <div class="date-strip" id="homeDateTabs" role="tablist" aria-label="Select date"></div>
        <div class="league-filters" id="leagueFilters" role="toolbar" aria-label="League filter"></div>
        <div id="homeFixtures"></div>
      </section>

      <!-- Best Bets View -->
      <section class="view hidden" id="viewBestBets">
        <div class="page-header">
          <h1 class="page-title">Best Bets</h1>
          <p class="page-subtitle">Highest-edge picks across all leagues today</p>
        </div>
        <div class="best-bets-date" id="bestBetsDate"></div>
        <div id="bestBetsList"></div>
      </section>

      <!-- Match Detail View -->
      <section class="view hidden" id="viewMatch">
        <button class="back-link" onclick="navigateTo('home')">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 11L5 7l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back to Fixtures
        </button>
        <div id="matchHeader"></div>
        <div class="market-tabs" id="marketTabs" role="tablist" aria-label="Market categories"></div>
        <div id="matchMarkets"></div>
      </section>

    </main>

    <!-- ===== Bet Slip (slides in from right on desktop, bottom sheet on mobile) ===== -->
    <aside class="slip" id="betSlip" aria-label="Bet slip">
      <div class="slip-head">
        <div class="slip-title-row">
          <h2 class="slip-title">Bet Slip</h2>
          <span class="slip-count-badge" id="slipCountBadge">0</span>
        </div>
        <button class="slip-clear-btn" id="slipClear" aria-label="Remove all selections">Clear All</button>
      </div>

      <div class="slip-body" id="slipBody">
        <div class="slip-legs" id="slipLegs"></div>
      </div>

      <div class="slip-foot" id="slipFoot">
        <div class="slip-summary-row">
          <span class="slip-summary-label">Combined Odds</span>
          <span class="slip-summary-value mono" id="slipCombinedOdds">--</span>
        </div>
        <div class="slip-stake-row">
          <div class="slip-stake-input-wrap">
            <span class="slip-stake-prefix">$</span>
            <input type="number" class="slip-stake-input" id="slipStakeInput" placeholder="Stake" min="0" step="any" aria-label="Stake amount">
          </div>
        </div>
        <div class="slip-quick-stakes">
          <button class="quick-stake" data-amount="5">$5</button>
          <button class="quick-stake" data-amount="10">$10</button>
          <button class="quick-stake" data-amount="25">$25</button>
          <button class="quick-stake" data-amount="50">$50</button>
          <button class="quick-stake" data-amount="100">$100</button>
        </div>
        <div class="slip-payout-row">
          <span class="slip-payout-label">Potential Win</span>
          <span class="slip-payout-value" id="slipPayout">$0.00</span>
        </div>
        <button class="slip-score-btn" id="slipScoreBtn">Score My Parlay</button>
        <div class="slip-quality hidden" id="slipQuality">
          <div class="quality-bar"><div class="quality-fill" id="qualityFill"></div></div>
          <span class="quality-label" id="qualityLabel"></span>
          <div class="quality-warnings" id="qualityWarnings"></div>
        </div>
        <div class="slip-actions-row">
          <button class="slip-share-btn" id="slipShareBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            Share Parlay
          </button>
        </div>
      </div>
    </aside>

    <!-- Mobile bottom bar for slip (shows when selections exist) -->
    <div class="slip-mobile-bar hidden" id="slipMobileBar" onclick="toggleMobileSlip()">
      <div class="slip-mobile-bar-left">
        <span class="slip-mobile-count" id="slipMobileCount">0</span>
        <span class="slip-mobile-label">Bet Slip</span>
      </div>
      <div class="slip-mobile-bar-right">
        <span class="slip-mobile-odds" id="slipMobileOdds">--</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <!-- Mobile overlay backdrop -->
    <div class="slip-backdrop hidden" id="slipBackdrop" onclick="toggleMobileSlip()"></div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
